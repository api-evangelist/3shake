summary:
  official_count: 4
  api_client_count: 3
  finding: >-
    3-shake ships NO client library for the current Reckoner External API (openapi/3shake-reckoner-external-api-openapi.yml)
    and none for the Securify Scan public API. The only first-party API client in any public registry is
    the Reckoner CDP family: reckoner-cdp-go (Go, untagged pseudo-version from 2019-07-08), the reckoner_cdp Ruby gem
    (0.1.2, 2020-11-05) and the fluent-plugin-reckoner-cdp Fluentd output plugin (0.1.3, 2020-11-05). All three target
    the older Reckoner CDP streaming/query surface (/api/v1/streaming, /api/v1/query), not the External API; the Go
    client ships no production default host (defaultHost is localhost:8888) and both gems point their homepage at
    GitHub repos that now return 404. Newest first-party API-client release in any registry: 2020-11-05, five and a half
    years before this probe. Treat them as decayed artifacts, not as SDK coverage of the API this repo describes.
