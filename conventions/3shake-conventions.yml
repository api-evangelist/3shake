idempotency:
  coverage: none
  mechanism: null
  header: null
  scope: []
  note: >-
    No Idempotency-Key header, parameter or extension appears anywhere in the contract (zero occurrences of /idempot/i),
    and the docs describe none. Four mutating operations are exposed — runWorkflow, cancelWorkflowJobs,
    deleteIntegration, deleteAccount — and a retried runWorkflow after a timeout will start a second workflow job that
    the caller cannot deduplicate. No Idempotency pointer is emitted in apis.yml.
reversibility:
  grade: documented
  overall: partial
  note: >-
    One of the four write surfaces has a first-class reversal operation and it is declared in the contract; the other
    three do not, and no reversal window is stated anywhere in the contract or the release notes. Grade is `documented`
    (a reversal path exists) and NOT `verified`, because no window is published. No window is asserted here.
  write_surfaces:
  - operation: runWorkflow
    method: POST
    path: /workflows/{workflowId}/run
    reversal: cancelWorkflowJobs
    reversal_path: PUT /workflows/{workflowId}/jobs/{jobId}/cancel
    window_stated: false
    window: null
    note: >-
      Cancel is only meaningful while the job is live. The WorkflowJobStatus enum makes the state machine explicit —
      SUBMITTING, RUNNABLE, RUNNING are cancellable in principle and move to CANCEL_STARTED then CANCELED; COMPLETED,
      FAILED and SERVER_ERROR are terminal. The contract does not say what cancel returns for a terminal job, and
      cancelling does not undo rows a sink task has already written downstream.
  - operation: deleteIntegration
    method: DELETE
    path: /integrations/{serviceName}/{integrationId}
    reversal: null
    window_stated: false
    note: >-
      No restore or undelete operation exists. The `force` query parameter widens the blast radius (deleting a
      connection still referenced by workflows) rather than narrowing it.
  - operation: deleteAccount
    method: DELETE
    path: /accounts/{accountId}
    reversal: null
    window_stated: false
    note: >-
      No restore operation and no soft-delete/retention period is documented. A `cascade` query parameter exists. This
      is the highest-consequence operation in the API and it is irreversible as published.
  - operation: cancelWorkflowJobs
    method: PUT
    path: /workflows/{workflowId}/jobs/{jobId}/cancel
    reversal: runWorkflow
    window_stated: false
    note: A cancelled job is not resumable; re-running starts a new job with a new jobId.
dry_run_mode:
