aid: 3shake
name: 3-shake
description: >-
  3-shake, Inc. (株式会社スリーシェイク) is a Tokyo-based cloud and reliability engineering company, founded in 2015, that
  operates four product lines. Sreake is its SRE / platform-engineering consulting and managed-operations practice for
  AWS, Google Cloud and Kubernetes. Reckoner is a no-code ETL and data-integration SaaS with 100+ SaaS, DWH and database
  connectors, a scheduling and workflow engine, and a public Reckoner External API (OpenAPI 3.0.3) for running
  workflows, reading job results, managing connections, projects and accounts from outside the console. Securify is a
  Japanese ASM and automated vulnerability-diagnosis platform covering web-application, SaaS, cloud-posture (CSPM),
  WordPress and SBOM scanning, with a public API for triggering diagnostics from a CI/CD pipeline and an API-diagnosis
  mode that scans a REST API from an uploaded OpenAPI definition. Relance is a freelance-engineer talent referral
  service. The company holds ISMS certification against ISO/IEC 27001:2013 and JIS Q 27001:2014 (registration IS 752246).
