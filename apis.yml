apis:
- name: Reckoner External API
  description: >-
    Public REST API for Reckoner, 3-shake's no-code ETL / data-integration SaaS. Fifteen operations across five tag
    groups let an external system run a workflow with parameter overrides, poll or cancel the resulting job, list and
    export workflow definitions, read workflow usage (data volume and run counts), list and delete connection
    (integration) records, list projects and project accounts, delete an account, and refresh an access token. Bearer
    auth with a `pat_`-prefixed access token; a `prt_`-prefixed refresh token mints new access tokens.
  humanURL: https://developers.reckoner-api.com/reckoner-external-api.html
  baseURL: https://cdp-server.reckoner-api.com/api/external/v1
  image: https://reckoner.io/wp-content/uploads/2022/10/reckoner_ogp_221025.webp
