- name: Securify Scan Public API
  description: >-
    Public API for Securify Scan, 3-shake's automated vulnerability-diagnosis and ASM platform. A tenant creates a
    public API token in the console and calls the API to start a diagnosis, typically from a CD pipeline after a
    staging deploy; a diagnosis ID is returned on success. The host answers unauthenticated calls with an
    RFC 9457-shaped problem body. The reference documentation is a Zendesk help centre that sits behind a Cloudflare
    bot challenge, so no machine-readable contract could be harvested for this API.
  humanURL: https://help-scan.securify.jp/hc/ja/articles/25133482168345
  baseURL: https://scan.securify.jp/api/v1
