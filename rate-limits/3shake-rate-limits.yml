limit_count: 0
note: >-
  Reckoner enforces rate limiting and says so in the contract — a 429 TooManyRequests response with a
  RATE_LIMIT_EXCEEDED code and a worked example is declared on 14 of the 15 operations — but publishes NO number and NO
  runtime signal. There is no RateLimit-* or X-RateLimit-* header, no Retry-After, and no limits page in the API
  reference or the help centre index. limit_count is therefore an honest 0: the ceiling exists and is undiscoverable
  until a client hits it. A client can only detect exhaustion after the fact and must invent its own backoff.
  Separately, the plan quotas in plans/3shake-plans-pricing.yml (10-50 GB and 200-1,000 workflow runs per month) are the
  published consumption ceilings, but those are billing quotas measured per month, not per-second request limits, and
  they are enforced against workflow execution rather than API calls.
