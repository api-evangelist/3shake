event_states:
  source: openapi/3shake-reckoner-external-api-openapi.yml#/components/schemas/WorkflowJobStatus
  states: [SUBMITTING, RUNNABLE, RUNNING, COMPLETED, FAILED, CANCEL_STARTED, CANCELED, SERVER_ERROR]
  terminal: [COMPLETED, FAILED, CANCELED, SERVER_ERROR]
  note: >-
    These are the job states a notification reports on and the states a polling client reads from getWorkflowJob. They
    are the closest thing the provider publishes to an event vocabulary.
polling_alternative:
  operation: getWorkflowJob
  path: 'GET /workflows/{workflowId}/jobs/{jobId}'
  note: >-
    Because no outbound payload is documented, the reliable machine path after runWorkflow is to poll getWorkflowJob on
    the returned jobId until status is terminal. The skills/ artifact uses this rather than the notification webhook.
