note: >-
  3-shake publishes no AsyncAPI document for any product — searched the GitHub org, the API reference host and
  /asyncapi.yaml on every host, all misses. Reckoner nonetheless has a real, contract-evidenced event surface in BOTH
  directions, so this file captures the webhook catalogue and the repo emits a Webhooks pointer rather than an AsyncAPI
  one. Nothing here is invented: every channel below is named by a schema or an enum value in the provider's own
  OpenAPI. Payload shapes are NOT recorded because the contract does not carry them — an outbound notification body is
  never described in the OpenAPI (it is not an operation of this API) and no published document could be read for it.
  Recording a guessed payload here would be exactly the fabrication this pipeline forbids.
inbound:
  description: Webhook triggers that start a workflow from outside Reckoner.
  evidence:
  - schema: Workflow.webhooks
    text: 作成済みのWebhookトリガーURLの一覧 (list of created webhook trigger URLs)
    source: openapi/3shake-reckoner-external-api-openapi.yml#/components/schemas/Workflow
  - schema: WorkflowJobTrigger
    text: 'enum value `webhook` — Webhook実行 (execution by webhook)'
    source: openapi/3shake-reckoner-external-api-openapi.yml#/components/schemas/WorkflowJobTrigger
  channels:
  - name: workflow.trigger
    direction: inbound
    transport: HTTPS POST to a per-workflow trigger URL minted in the console
    url_discovery: read the webhooks[] array on GET /workflows/{workflowId} (getWorkflow)
    creates: a WorkflowJob whose trigger is `webhook`
    note: >-
      The trigger URL is created in the console, not through the API; the API can only read the list of URLs already
      created. This is a genuine second execution path alongside runWorkflow — an agent that cannot hold a pat_ token
      can still start a workflow with a trigger URL.
