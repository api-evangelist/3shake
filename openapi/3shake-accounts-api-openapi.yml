openapi: 3.2.0
info:
  title: Reckoner External Accounts API
  description: Reckoner API 仕様
  version: 1.1.0
servers:
- url: https://cdp-server.reckoner-api.com/api/external/v1
  description: Reckoner API サーバー
security:
- BearerAccessAuth: []
tags:
- name: Accounts
paths:
  /accounts/{accountId}:
    delete:
      summary: アカウント削除
      description: 'アカウントを削除します.


        権限: チーム管理者'
      operationId: deleteAccount
      tags:
      - Accounts
      parameters:
      - name: accountId
        in: path
        required: true
        description: アカウントID
        schema:
          type: integer
      - name: cascade
        in: query
        required: false
        description: 'trueを指定した場合、アカウントに紐づくReckoner APIトークンが存在する場合にAPIトークンも削除する。

          未指定またはfalseの場合、アカウントに紐づくReckoner APIトークンが存在する場合には削除できずエラーが返される。

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: リソース競合。削除対象のアカウントに紐づくReckoner APIトークンが存在
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  required:
                  - access_tokens
                  - refresh_tokens
                  properties:
                    code:
                      type: string
                      enum:
                      - CONFLICT
                    access_tokens:
                      type: array
                      description: 削除対象のアカウントに紐づくアクセストークン
                      items:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: integer
                            description: アクセストークンID
                          name:
                            type: string
                            description: アクセストークン名
                    refresh_tokens:
                      type: array
                      description: 削除対象のアカウントに紐づくリフレッシュトークン
                      items:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: integer
                            description: リフレッシュトークンID
                          name:
                            type: string
                            description: リフレッシュトークン名
              examples:
                conflict:
                  summary: アカウントに紐づくReckoner APIトークン情報
                  value:
                    code: CONFLICT
                    message: このアカウントにはReckoner APIトークンが紐づいているため削除できません
                    access_tokens:
                    - id: 1
                      name: アクセストークン
                    refresh_tokens:
                    - id: 1
                      name: リフレッシュトークン
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    TooManyRequests:
      description: レート制限超過
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - RATE_LIMIT_EXCEEDED
          examples:
            rateLimitExceeded:
              summary: レート制限超過
              value:
                code: RATE_LIMIT_EXCEEDED
                message: rate limit exceeded
    NotFound:
      description: リソース未検出
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - NOT_FOUND
          examples:
            notFound:
              summary: リソース未検出
              value:
                code: NOT_FOUND
                message: 指定されたリソースが見つかりません
    BadRequest:
      description: 不正リクエスト
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - BAD_REQUEST
    Forbidden:
      description: 認可エラー
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - FORBIDDEN
                  - FEATURE_NOT_AVAILABLE
          examples:
            forbidden:
              summary: アクセス権限なし
              value:
                code: FORBIDDEN
                message: このリソースへのアクセス権限がありません
            featureNotAvailable:
              summary: プランで利用できない機能
              value:
                code: FEATURE_NOT_AVAILABLE
                message: このチームではReckoner APIを利用できません
    InternalServerError:
      description: 内部サーバーエラー
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INTERNAL_SERVER_ERROR
          examples:
            internalError:
              summary: サーバーエラー
              value:
                code: INTERNAL_SERVER_ERROR
                message: 内部サーバーエラーが発生しました
    PaymentRequired:
      description: サブスクリプションが無効
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - SUBSCRIPTION_INACTIVE
          examples:
            subscriptionInactive:
              summary: サブスクリプションが無効のため書き込み操作を実行できない
              value:
                code: SUBSCRIPTION_INACTIVE
                message: subscription is inactive
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - UNAUTHORIZED
                  - TOKEN_INVALID
                  - TOKEN_EXPIRED
                  - TOKEN_REVOKED
          examples:
            unauthorized:
              summary: 認証エラー
              value:
                code: UNAUTHORIZED
                message: unauthorized
            tokenInvalid:
              summary: トークン不正
              value:
                code: TOKEN_INVALID
                message: access token invalid
            tokenExpired:
              summary: トークン期限切れ
              value:
                code: TOKEN_EXPIRED
                message: access token expired
            tokenRevoked:
              summary: トークン無効化済み
              value:
                code: TOKEN_REVOKED
                message: access token revoked
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: エラーコード
        message:
          type: string
          description: エラーメッセージ
  securitySchemes:
    BearerAccessAuth:
      type: http
      description: アクセストークン（pat_ プレフィックス）
      scheme: bearer
      bearerFormat: Access token
    BearerRefreshAuth:
      type: http
      description: リフレッシュトークン（prt_ プレフィックス）
      scheme: bearer
      bearerFormat: Refresh token
