            type: object
            required:
            - id
            - name
            properties:
              id:
                description: プロジェクトID
                type: integer
              name:
                description: プロジェクト名
                type: string
    WorkflowUsageDetail:
      allOf:
      - $ref: '#/components/schemas/WorkflowUsage'
      - type: object
        required:
        - date
        - classifications
        properties:
          date:
            description: 対象日
            type: string
            format: date
          classifications:
            description: プロジェクト内訳。リクエストにclassification=noneを指定した場合は空配列
            type: array
            items:
              $ref: '#/components/schemas/WorkflowUsageClassification'
    WorkflowUsages:
      type: object
      required:
      - total
      - details
      properties:
        total:
          description: 利用状況合計
          $ref: '#/components/schemas/WorkflowUsageTotal'
        details:
          description: 利用状況詳細
          type: array
          items:
            $ref: '#/components/schemas/WorkflowUsageDetail'
    Integrations:
      type: object
      description: '接続情報の一覧

        '
      required:
      - total
      - integrations
      properties:
        total:
          type: integer
          description: 接続情報の総件数
        integrations:
          type: object
          description: '各サービス名がキーであり、値は接続情報の配列であるオブジェクト。

            該当するサービスの接続情報が存在しない場合、値は空配列となる。

            接続情報のプロパティはサービスごとに異なり、機密情報は含まれない。

            '
          additionalProperties:
            type: array
            items:
              type: object
              required:
              - integration_id
              - team_id
              - project_id
              - name
              properties:
                integration_id:
                  type: integer
                  description: 接続情報ID
                team_id:
                  type: integer
                project_id:
                  type: integer
                name:
                  type: string
              additionalProperties: true
    Project:
      type: object
      required:
      - id
      - name
      - is_default
      - saves_job_result
      properties:
        id:
          type: integer
          description: プロジェクトID
        name:
          type: string
          description: プロジェクト名
        description:
          type: string
          description: プロジェクト概要
        is_default:
          type: boolean
          description: デフォルトプロジェクトかどうか
        saves_job_result:
          type: boolean
          description: ワークフロー実行履歴データを保存するかどうか
    Projects:
      type: object
      required:
      - total
      - projects
      properties:
        total:
          type: integer
          description: プロジェクト数
        projects:
          type: array
          description: プロジェクト一覧
          items:
            $ref: '#/components/schemas/Project'
    ProjectAccount:
      type: object
      required:
      - id
      - email
      - is_team_admin
      - roles
      properties:
        id:
          type: integer
          description: アカウントID
        email:
          type: string
          description: メールアドレス
        is_team_admin:
          type: boolean
          description: チーム管理者かどうか
        roles:
          type: array
          description: 権限一覧
          items:
            type: string
            enum:
            - project-admin
            - workflow-editor
            - integration-editor
            - read-only
    ProjectAccounts:
      type: object
      required:
      - total
      - accounts
      properties:
        total:
          type: integer
          description: アカウント数
        accounts:
          type: array
          description: アカウント一覧
          items:
            $ref: '#/components/schemas/ProjectAccount'
    RefreshedToken:
      type: object
      description: 再発行したアクセストークン
      required:
      - access_token
      - expires_at
      properties:
        access_token:
          description: アクセストークン
          type: string
        expires_at:
          description: 有効期限
          type: string
          format: date-time
  requestBodies:
    WorkflowRun:
      description: ワークフロー実行時に上書きするパラメータ変数
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowRunParameter'
  responses:
    BadRequest:
      description: 不正リクエスト
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - BAD_REQUEST
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - UNAUTHORIZED
                  - TOKEN_INVALID
                  - TOKEN_EXPIRED
                  - TOKEN_REVOKED
          examples:
            unauthorized:
              summary: 認証エラー
              value:
                code: UNAUTHORIZED
                message: unauthorized
            tokenInvalid:
              summary: トークン不正
              value:
                code: TOKEN_INVALID
                message: access token invalid
            tokenExpired:
              summary: トークン期限切れ
              value:
                code: TOKEN_EXPIRED
                message: access token expired
            tokenRevoked:
              summary: トークン無効化済み
              value:
                code: TOKEN_REVOKED
                message: access token revoked
    PaymentRequired:
      description: サブスクリプションが無効
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - SUBSCRIPTION_INACTIVE
          examples:
            subscriptionInactive:
              summary: サブスクリプションが無効のため書き込み操作を実行できない
              value:
                code: SUBSCRIPTION_INACTIVE
                message: subscription is inactive
    Forbidden:
      description: 認可エラー
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - FORBIDDEN
                  - FEATURE_NOT_AVAILABLE
          examples:
            forbidden:
