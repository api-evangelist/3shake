        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /integrations/{serviceName}/{integrationId}:
    delete:
      summary: 接続情報削除
      description: 指定された接続情報を削除します
      operationId: deleteIntegration
      tags:
      - Integrations
      parameters:
      - name: serviceName
        in: path
        required: true
        description: 削除対象の接続情報のサービス名
        schema:
          type: string
        example: mysql
      - name: integrationId
        in: path
        required: true
        description: 削除対象の接続情報のID
        schema:
          type: integer
      - name: force
        in: query
        required: false
        description: 'trueを指定した場合、ワークフローで利用中の接続情報であっても強制的に削除する。

          未指定またはfalseの場合、ワークフローで利用中の接続情報は削除できずエラーが返される。

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: リソース競合。削除対象の接続情報がワークフローで利用中
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  required:
                  - workflows
                  properties:
                    code:
                      type: string
                      enum:
                      - CONFLICT
                    workflows:
                      type: array
                      description: 削除対象の接続情報を利用しているワークフローの一覧
                      items:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: integer
                            description: ワークフローID
                          name:
                            type: string
                            description: ワークフロー名
              examples:
                conflict:
                  summary: ワークフローで利用中の接続情報
                  value:
                    code: CONFLICT
                    message: この接続情報はワークフローで利用されているため削除できません
                    workflows:
                    - id: 1
                      name: 日次データ同期
                    - id: 2
                      name: 月次レポート生成
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects:
    get:
      summary: プロジェクト一覧
      description: チーム管理者の場合は全プロジェクトを、非チーム管理者の場合はいずれかの権限を持つプロジェクト一覧を取得します
      operationId: listProjects
      tags:
      - Projects
      responses:
        '200':
          description: '成功

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projects'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}:
    get:
      summary: プロジェクト詳細
      description: プロジェクト詳細を取得します
      operationId: getProject
      tags:
      - Projects
      parameters:
      - name: projectId
        in: path
        required: true
        description: プロジェクトID
        schema:
          type: integer
      responses:
        '200':
          description: '成功

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}/accounts:
    get:
      summary: アカウント一覧
      description: 'プロジェクト内のアカウント一覧を取得します.


        権限: チーム管理者またはプロジェクト管理者

        '
      operationId: getProjectAccounts
      tags:
      - Projects
      parameters:
      - name: projectId
        in: path
        required: true
        description: プロジェクトID
        schema:
          type: integer
      responses:
        '200':
          description: '成功

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccounts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /accounts/{accountId}:
    delete:
      summary: アカウント削除
      description: 'アカウントを削除します.


        権限: チーム管理者

        '
      operationId: deleteAccount
      tags:
      - Accounts
      parameters:
      - name: accountId
        in: path
        required: true
        description: アカウントID
        schema:
          type: integer
      - name: cascade
        in: query
        required: false
        description: 'trueを指定した場合、アカウントに紐づくReckoner APIトークンが存在する場合にAPIトークンも削除する。

          未指定またはfalseの場合、アカウントに紐づくReckoner APIトークンが存在する場合には削除できずエラーが返される。

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: リソース競合。削除対象のアカウントに紐づくReckoner APIトークンが存在
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  required:
                  - access_tokens
                  - refresh_tokens
                  properties:
                    code:
                      type: string
                      enum:
                      - CONFLICT
                    access_tokens:
                      type: array
                      description: 削除対象のアカウントに紐づくアクセストークン
                      items:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: integer
                            description: アクセストークンID
                          name:
                            type: string
                            description: アクセストークン名
                    refresh_tokens:
                      type: array
                      description: 削除対象のアカウントに紐づくリフレッシュトークン
                      items:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: integer
                            description: リフレッシュトークンID
                          name:
                            type: string
                            description: リフレッシュトークン名
              examples:
                conflict:
                  summary: アカウントに紐づくReckoner APIトークン情報
                  value:
                    code: CONFLICT
                    message: このアカウントにはReckoner APIトークンが紐づいているため削除できません
                    access_tokens:
                    - id: 1
                      name: アクセストークン
                    refresh_tokens:
                    - id: 1
                      name: リフレッシュトークン
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/token/refresh:
    post:
      summary: トークンリフレッシュ
      description: Authorizationヘッダに指定したリフレッシュトークンからアクセストークンを発行する
      security:
      - BearerRefreshAuth: []
      operationId: authTokenRefresh
      tags:
      - Auth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshedToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
security:
- BearerAccessAuth: []
components:
  securitySchemes:
    BearerAccessAuth:
      type: http
      description: アクセストークン（pat_ プレフィックス）
      scheme: bearer
      bearerFormat: Access token
    BearerRefreshAuth:
      type: http
      description: リフレッシュトークン（prt_ プレフィックス）
      scheme: bearer
      bearerFormat: Refresh token
  schemas:
    WorkflowRunParameterItem:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: パラメータ変数名
        value:
          type: string
          description: パラメータ値
    WorkflowRunParameter:
      type: object
      properties:
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunParameterItem'
    JobId:
      type: object
      required:
      - job_id
      properties:
        job_id:
          type: integer
          description: 実行開始したワークフローのジョブID
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: エラーコード
        message:
          type: string
          description: エラーメッセージ
    WorkflowJobStatus:
      type: string
      description: 'ワークフロージョブのステータス


        * `SUBMITTING` - ジョブ送信中

        * `RUNNABLE` - 実行前

        * `RUNNING` - 実行中

        * `COMPLETED` - 正常完了

        * `FAILED` - 失敗

        * `CANCEL_STARTED` - キャンセル処理開始

        * `CANCELED` - キャンセル完了

        * `SERVER_ERROR` - サーバーエラー

        '
      enum:
      - SUBMITTING
      - RUNNABLE
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCEL_STARTED
      - CANCELED
      - SERVER_ERROR
    WorkflowJobTrigger:
      type: string
      description: 'ワークフロージョブの実行方法


        * `button` - ブラウザ画面上の実行ボタンによる実行

        * `scheduled` - スケジューリング実行

        * `webhook` - Webhook実行

        * `external_api` - Reckoner APIによる実行

        '
      enum:
      - button
      - scheduled
      - webhook
      - external_api
    WorkflowJobError:
      type: object
      required:
      - task_name
      - category
      - subcategory
      - message
      properties:
        task_name:
          type: string
          description: タスク名
        category:
          type: string
          description: タスクのカテゴリ
          example: source
        subcategory:
          type: string
          description: タスクのサブカテゴリ
          example: mysql
        message:
          type: string
          description: エラーメッセージ
    WorkflowJob:
      type: object
      required:
      - status
      - trigger
      properties:
        started_at:
          type: string
          format: date-time
          description: 実行開始時間。フォーマットはISO 8601
        ended_at:
          type: string
          format: date-time
          description: 実行終了時間。フォーマットはISO 8601
        status:
          $ref: '#/components/schemas/WorkflowJobStatus'
        trigger:
          $ref: '#/components/schemas/WorkflowJobTrigger'
        errors:
          type: array
          description: ワークフロージョブで発生したエラーの一覧。ワークフロージョブ失敗時のみ返却される
          items:
            $ref: '#/components/schemas/WorkflowJobError'
    WorkflowJobSummary:
      type: object
      required:
      - id
      - status
      - trigger
      properties:
        id:
          type: integer
          description: ジョブID
        started_at:
          type: string
          format: date-time
          description: 実行開始時間。フォーマットはISO 8601
        ended_at:
          type: string
          format: date-time
          description: 実行終了時間。フォーマットはISO 8601
        status:
          $ref: '#/components/schemas/WorkflowJobStatus'
        trigger:
          $ref: '#/components/schemas/WorkflowJobTrigger'
    WorkflowJobs:
      type: object
      required:
      - total
      - jobs
      properties:
        total:
          type: integer
          description: ジョブ数
        jobs:
          type: array
          description: ジョブ一覧
          items:
            $ref: '#/components/schemas/WorkflowJobSummary'
    Task:
      type: object
      description: ワークフロー内のタスク
      required:
      - name
      - category
      - subcategory
      - property
      properties:
        name:
          description: タスクの表示名
          type: string
        category:
          description: タスクのカテゴリ
          type: string
          enum:
          - source
          - transform
          - analytics
          - sink
          x-enum-descriptions:
            source: ソース(転送元)
            transform: 変換
            analytics: 分析
            sink: シンク(転送先)
        subcategory:
          description: タスクのサブカテゴリ
          type: string
          example: MySQL
        property:
          description: タスクのプロパティ。タスクごとに個別のスキーマのJSON
          type: object
          additionalProperties: true
        integration_name:
          description: タスクで利用している接続情報の名前
          type: string
    TaskDependency:
      type: object
      description: ワークフロー内のタスクの依存関係
      required:
      - from
      - to
      properties:
        from:
          description: 依存元タスクの表示名
          type: string
        to:
          description: 依存先タスクの表示名
          type: string
    WorkflowParameter:
      type: object
      description: ワークフローに設定されているパラメーター変数
      required:
      - name
      - value
      - is_secret
      properties:
        name:
          description: パラメーター変数名
          type: string
        value:
          description: パラメーター変数の値。シークレット属性である場合にはマスクされた値が返される
          type: string
        is_secret:
          description: パラメーター変数がシークレット属性かどうか
          type: boolean
    WorkflowSchedule:
      type: object
      description: ワークフローのスケジュール実行設定
      required:
      - is_enabled
      - cron
      - timezone
      properties:
        is_enabled:
          description: スケジュール設定が有効かどうか
          type: boolean
        cron:
          description: 実行間隔をcron表記した文字列
          type: string
          example: '*/30 * * * *'
        timezone:
          description: スケジュール実行設定のタイムゾーン
          type: string
          example: UTC
    WorkflowNotificationStatus:
      type: string
      description: 通知対象となるワークフロージョブ完了ステータス
      enum:
      - ALL
      - COMPLETED
      - FAILED
      x-enum-descriptions:
        ALL: 成功時および失敗時
        COMPLETED: 成功時
        FAILED: 失敗時
    WorkflowNotificationEmail:
      type: object
      description: ワークフローに設定されているメール通知
      required:
      - status
      - email
      properties:
        status:
          $ref: '#/components/schemas/WorkflowNotificationStatus'
        email:
          type: string
          description: 通知先メールアドレス
    WorkflowNotificationWebhook:
      type: object
      description: ワークフローに設定されているWebhook通知
      required:
      - status
      - url
      properties:
        status:
          $ref: '#/components/schemas/WorkflowNotificationStatus'
        url:
          type: string
          description: 通知先URL
    WorkflowNotificationSlack:
      type: object
      description: ワークフローに設定されているSlack通知
      required:
      - status
      - channel
      properties:
        status:
          $ref: '#/components/schemas/WorkflowNotificationStatus'
        channel:
          type: string
          description: 通知先チャンネル名
    WorkflowNotificationMSTeams:
      type: object
      description: ワークフローに設定されているMicrosoft Teams通知
      required:
      - status
      - team
      - channel
      properties:
        status:
          $ref: '#/components/schemas/WorkflowNotificationStatus'
        team:
          type: string
          description: 通知先チーム名
        channel:
          type: string
          description: 通知先チャンネル名
    WorkflowNotifications:
      type: object
      description: ワークフローの通知設定
      required:
      - emails
      - webhooks
      - slacks
      - msteams
      properties:
        emails:
          type: array
          description: メール通知設定の一覧。未設定の場合は空配列
          items:
            $ref: '#/components/schemas/WorkflowNotificationEmail'
        webhooks:
          type: array
          description: Webhook通知設定の一覧。未設定の場合は空配列
          items:
            $ref: '#/components/schemas/WorkflowNotificationWebhook'
        slacks:
          type: array
          description: Slack通知設定の一覧。未設定の場合は空配列
          items:
            $ref: '#/components/schemas/WorkflowNotificationSlack'
        msteams:
          type: array
          description: Microsoft Teams通知設定の一覧。未設定の場合は空配列
          items:
            $ref: '#/components/schemas/WorkflowNotificationMSTeams'
    Label:
      type: object
      description: ワークフローに付与されたラベル
      required:
      - id
      - name
      - description
      properties:
        id:
          description: ラベルID
          type: integer
        name:
          description: ラベル名
          type: string
        description:
          description: 説明
          type: string
    Workflow:
      type: object
      required:
      - id
      - name
      - tasks
      - task_dependencies
      - parameters
      - webhooks
      - labels
      properties:
        id:
          type: integer
          description: ワークフローID
        name:
          type: string
          description: ワークフロー名
        description:
          type: string
          description: ワークフローの説明
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        task_dependencies:
          type: array
          items:
            $ref: '#/components/schemas/TaskDependency'
        parameters:
          type: array
          description: パラメーター変数。未設定の場合は空配列
          items:
            $ref: '#/components/schemas/WorkflowParameter'
        schedule:
          $ref: '#/components/schemas/WorkflowSchedule'
        webhooks:
          type: array
          description: 作成済みのWebhookトリガーURLの一覧。未設定の場合は空配列
          items:
            description: 作成済みのWebhookトリガーURL
            type: string
        notifications:
          $ref: '#/components/schemas/WorkflowNotifications'
        labels:
          type: array
          description: ワークフローに付与されたラベルの一覧
          items:
            $ref: '#/components/schemas/Label'
    WorkflowSummary:
      type: object
      required:
      - id
      - name
      - updated_at
      - is_scheduled
      - labels
      properties:
        id:
          type: integer
          description: ワークフローID
        name:
          type: string
          description: ワークフロー名
        description:
          type: string
          description: ワークフローの説明
        updated_at:
          type: string
          format: date-time
          description: 最終更新日時。フォーマットはISO 8601
        last_started_at:
          type: string
          format: date-time
          description: 最終実行日時。フォーマットはISO 8601
        is_scheduled:
          type: boolean
          description: スケジュール実行設定が有効かどうか
        labels:
          type: array
          description: ワークフローに付与されたラベルの一覧。未設定の場合は空配列
          items:
            $ref: '#/components/schemas/Label'
    Workflows:
      type: object
      required:
      - total
      properties:
        total:
          type: integer
          description: ワークフロー数。フィルター条件指定時は、条件に一致するワークフロー数
        workflows:
          type: array
          description: ワークフロー一覧
          items:
            $ref: '#/components/schemas/WorkflowSummary'
    ExportTask:
      type: object
      description: エクスポートしたワークフロー内のタスク
      required:
      - name
      - category
      - subcategory
      - property
      - position
      properties:
        name:
          description: タスクの表示名
          type: string
        category:
          description: タスクのカテゴリ
          type: string
          enum:
          - source
          - transform
          - analytics
          - sink
          x-enum-descriptions:
            source: ソース(転送元)
            transform: 変換
            analytics: 分析
            sink: シンク(転送先)
        subcategory:
          description: タスクのサブカテゴリ
          type: string
          example: MySQL
        position:
          description: タスクのブラウザ画面上の位置
          type: object
          required:
          - x
          - y
          properties:
            x:
              description: 横方向の座標
              type: integer
            y:
              description: 縦方向の座標
              type: integer
        property:
          description: タスクのプロパティ。タスクごとに個別のスキーマのJSON
          type: object
          additionalProperties: true
    ExportWorkflowParameter:
      type: object
      description: ワークフローに設定されているパラメーター変数。エクスポート元の変数がシークレット属性の場合、値をマスクした上で非シークレット属性として扱われる
      required:
      - name
      - value
      properties:
        name:
          description: パラメーター変数名
          type: string
        value:
          description: パラメーター変数の値。エクスポート元の値がシークレット属性である場合にはマスクされた値が返される
          type: string
    ExportWorkflow:
      type: object
      required:
      - name
      - type
      - tasks
      - dependencies
      - parameters
      properties:
        name:
          type: string
          description: ワークフロー名
        description:
          type: string
          description: ワークフローの説明
        type:
          type: string
          description: ワークフロータイプ
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ExportTask'
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/TaskDependency'
        parameters:
          type: array
          description: パラメーター変数。未設定の場合は空配列
          items:
            $ref: '#/components/schemas/ExportWorkflowParameter'
    WorkflowUsageTotal:
      type: object
      required:
      - execution_counts
      properties:
        execution_counts:
          description: ワークフロー実行回数
          type: integer
        usage_gigabytes:
          description: データ利用量(GB)
          type: number
    WorkflowUsage:
      type: object
      required:
      - workflow_counts
      - execution_counts
      properties:
        workflow_counts:
          description: ワークフロー数
          type: integer
        execution_counts:
          description: ワークフロー実行回数
          type: integer
        usage_gigabytes:
          description: データ利用量(GB)
          type: number
    WorkflowUsageClassification:
      allOf:
      - $ref: '#/components/schemas/WorkflowUsage'
      - type: object
        required:
        - project
        properties:
