openapi: 3.0.3
info:
  title: Reckoner External API
  description: Reckoner API 仕様
  version: 1.1.0
servers:
- url: https://cdp-server.reckoner-api.com/api/external/v1
  description: Reckoner API サーバー
paths:
  /workflows/{workflowId}/run:
    post:
      summary: ワークフロー実行
      description: 指定されたワークフローを実行します
      operationId: runWorkflow
      tags:
      - Workflows
      parameters:
      - name: workflowId
        in: path
        required: true
        description: ワークフローID
        schema:
          type: integer
      requestBody:
        $ref: '#/components/requestBodies/WorkflowRun'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workflows/{workflowId}/jobs/{jobId}:
    get:
      summary: ワークフロージョブ実行結果取得
      description: 指定されたワークフロージョブの実行結果を取得します
      operationId: getWorkflowJob
      tags:
      - Workflows
      parameters:
      - name: workflowId
        in: path
        required: true
        description: ワークフローID
        schema:
          type: integer
      - name: jobId
        in: path
        required: true
        description: ワークフロージョブID
        schema:
          type: integer
      responses:
        '200':
          description: '成功

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workflows/{workflowId}/jobs:
    get:
      summary: ワークフロージョブ実行結果一覧取得
      description: 指定されたワークフローのジョブ実行結果一覧を取得します
      operationId: listWorkflowJobs
      tags:
      - Workflows
      parameters:
      - name: workflowId
        in: path
        required: true
        description: ワークフローID
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: 1ページあたりの最大件数。未指定時は100として扱われる
        schema:
          type: integer
          maximum: 100
      - name: page
        in: query
        required: false
        description: 'ページ番号。1ページあたりの最大件数は limit で指定。未指定時は1として扱われる

          '
        schema:
          type: integer
      - name: started_at
        in: query
        required: false
        description: ジョブの開始日。タイムゾーンはJST。指定した日付以降に開始したジョブのみ返却する
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: ended_at
        in: query
        required: false
        description: ジョブの終了日。タイムゾーンはJST。指定した日付以前に終了したジョブのみ返却する
        schema:
          type: string
          format: date
          example: '2026-01-01'
      responses:
        '200':
          description: '成功

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowJobs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workflows/{workflowId}/jobs/{jobId}/cancel:
    put:
      summary: ワークフロージョブキャンセル
      description: '指定されたワークフロージョブをキャンセルします.

        ジョブがすでに完了している場合、成功として扱いステータスコード 200 を返却します.

        '
      operationId: cancelWorkflowJobs
      tags:
      - Workflows
      parameters:
      - name: workflowId
        in: path
        required: true
        description: ワークフローID
        schema:
          type: integer
      - name: jobId
        in: path
        required: true
        description: ワークフロージョブID
        schema:
          type: integer
      responses:
        '200':
          description: '成功

            '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workflows/{workflowId}:
    get:
      summary: ワークフロー取得
      description: 指定されたワークフローの詳細情報を取得します
      operationId: getWorkflow
      tags:
      - Workflows
      parameters:
      - name: workflowId
        in: path
        required: true
        description: ワークフローID
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workflows/projects/{projectId}:
    get:
      summary: ワークフロー一覧取得
      description: 指定されたプロジェクト内のワークフローの一覧を取得します
      operationId: listWorkflows
      tags:
      - Workflows
      parameters:
      - name: projectId
        in: path
        required: true
        description: プロジェクトID
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: 1ページあたりの最大件数。未指定時は100として扱われる
        schema:
          type: integer
          maximum: 100
      - name: page
        in: query
        required: false
        description: 'ページ番号。1ページあたりの最大件数は limit で指定。未指定時は1として扱われる

          '
        schema:
          type: integer
      - name: search_words
        in: query
        required: false
        description: '検索文字列。ワークフロー名に対して部分一致検索する。未指定時はすべてのワークフローが対象となる

          '
        schema:
          type: string
      - name: label_ids
        in: query
        required: false
        description: 'ラベルID。未指定時はすべてのワークフローが対象となる。複数指定する場合はカンマ区切りで指定する

          '
        schema:
          type: string
      - name: schedule_filtering_by
        in: query
        required: false
        description: 'スケジュール設定の有無。未指定時はすべてのワークフローが対象となる

          - active: スケジュール設定有効のみ

          - inactive: スケジュール設定無効のみ

          - all: スケジュール設定に関わらずすべて

          '
        schema:
          type: string
          enum:
          - active
          - inactive
          - all
      - name: sort
        in: query
        required: false
        description: 'ソート順。"ソート項目名:ソート順"のように指定する。ソート項目名は下記の通り。ソート項目名未指定時は更新日時によりソートされる

          - name: ワークフロー名

          - updated_at: 更新日時

          - last_started_at: 最終実行日時

          ソート順は以下の通り。ソート順未指定の場合は降順でソートされる

          - asc: 昇順

          - desc: 降順

          '
        schema:
          type: string
          enum:
          - name:asc
          - name:desc
          - updated_at:asc
          - updated_at:desc
          - last_started_at:asc
          - last_started_at:desc
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflows'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workflows/{workflowId}/export:
    get:
      summary: ワークフローエクスポート
      description: 指定されたワークフローを、インポート可能な形式でエクスポートします
      operationId: exportWorkflow
      tags:
      - Workflows
      parameters:
      - name: workflowId
        in: path
        required: true
        description: ワークフローID
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportWorkflow'
          headers:
            Content-Disposition:
              description: ブラウザ向けのファイル名
              schema:
                type: string
              example: attachment; filename*=UTF-8''workflow-name.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workflows/usages:
    get:
      summary: ワークフロー利用状況取得
      description: ワークフローの利用状況一覧を取得します
      operationId: listWorkflowUsages
      tags:
      - Workflows
      parameters:
      - name: since_date
        in: query
        required: true
        description: 表示期間開始日
        schema:
          type: string
          format: date
        example: '2026-01-01'
      - name: until_date
        in: query
        required: true
        description: '表示期間終了日。

          表示期間開始日から30日後までを指定できる。

          前日以前を指定できる

          '
        schema:
          type: string
          format: date
        example: '2026-01-01'
      - name: classification
        in: query
        required: false
        description: 内訳。プロジェクトごと、または内訳なし
        schema:
          type: string
          enum:
          - none
          - by_project
          default: none
      - name: project_ids
        in: query
        required: false
        description: 'プロジェクトID。未指定時はすべてのプロジェクトが対象となる。複数指定する場合はカンマ区切りで指定する

          '
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowUsages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /integrations/projects/{projectId}:
    get:
      summary: 接続情報取得
      description: 指定されたプロジェクト内の接続情報の一覧を取得します
      operationId: listIntegrations
      tags:
      - Integrations
      parameters:
      - name: projectId
        in: path
        required: true
        description: プロジェクトID
        schema:
          type: integer
      - name: service
        in: query
        required: false
        description: 取得対象のサービス名。未指定時は全サービスの接続情報が対象となる
        schema:
          type: string
        example: mysql
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrations'
              examples:
                allServices:
                  summary: 全サービスの接続情報
                  value:
                    total: 2
                    adobe_analytics: []
                    airtable: []
                    amazon_redshift: []
                    amazon_ses: []
                    app_store_connect: []
                    aws_s3: []
                    azure_blob_storage: []
                    azure_sql: []
                    bcart: []
                    box: []
                    braze: []
                    bugyo_cloud: []
                    chatwork: []
                    climber_cloud: []
                    cloudsign: []
                    collaboflow: []
                    denodo: []
                    dr_sum: []
                    excel:
                    - id: 1
                      project_id: 2
                      team_id: 3
                      name: test1
                      auth_method: oauth
                      refreshed_at: '2026-02-20T13:00:06Z'
