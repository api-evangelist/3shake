standards:
- id: openapi-3.0
  conforms: true
  evidence: 'openapi: 3.0.3 declared in the Reckoner External API contract, 15 operations, 38 component schemas'
- id: oauth2
  conforms: false
  evidence: no oauth2 securityScheme is declared; auth is a bearer token with a proprietary refresh operation
- id: oidc
  conforms: false
  evidence: no openIdConnect securityScheme and no /.well-known/openid-configuration on any 3-shake host (all 404/401)
- id: rfc6750-bearer
  conforms: true
  evidence: 'components.securitySchemes.BearerAccessAuth type http, scheme bearer, presented in the Authorization header'
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Reckoner returns a vendor {code,message} envelope as application/json — no type/title/instance member and not
    application/problem+json. Note the sibling Securify Scan API DOES return an RFC 9457-shaped {title,status,detail}
    body (observed 401 at https://scan.securify.jp/api/v1) but also serves it as application/json, so neither product
    conforms fully.
- id: rfc9110-status-semantics
  conforms: true
  evidence: >-
    Correct and unusually granular status use — 402 for an inactive subscription distinct from 403 for a role or plan
    boundary, 429 for rate limiting, and FEATURE_NOT_AVAILABLE separated from FORBIDDEN inside 403.
- id: idempotency
  conforms: false
  evidence: no Idempotency-Key header, parameter or extension anywhere in the contract; four mutating operations exposed
- id: pagination
  conforms: true
  evidence: 'limit (max 100) + page query parameters on listWorkflowJobs and listWorkflows, with a `total` in the envelope'
  partial: true
  note: Only 2 of the 6 collection-returning operations paginate; the other four are unbounded.
- id: json-api
  conforms: false
  evidence: plain JSON resource representations, no JSON:API document structure
- id: rfc8594-sunset-header
  conforms: false
  evidence: no Sunset or Deprecation header is documented and no operation carries deprecated:true
- id: semver
  conforms: true
  evidence: 'info.version 1.1.0; the URI carries the major version as /api/external/v1'
  partial: true
  note: The version string is semver-shaped; no published policy states what a major bump would mean for consumers.
- id: cron
  conforms: true
  evidence: 'WorkflowSchedule.cron is a standard 5-field cron expression (example "*/30 * * * *") plus an IANA timezone'
- id: iso8601
  conforms: true
  evidence: 'WorkflowJob.started_at / ended_at are format:date-time, RefreshedToken.expires_at is format:date-time'
domain_standards:
