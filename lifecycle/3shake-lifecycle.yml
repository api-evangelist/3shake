product_lifecycle_notes:
- product: Reckoner CDP
  status: superseded
  evidence: >-
    The reckoner-cdp-go / reckoner_cdp / fluent-plugin-reckoner-cdp client libraries (2019-2020) target a
    streaming+query surface at /api/v1/streaming and /api/v1/query with a RECKONER-CDP HMAC auth scheme that appears
    nowhere in the current contract. Both gem homepages now 404 on GitHub. The CDP console host
    cdp-console.reckoner-api.com is still live and is the login the current product uses, so the CDP lineage survives
    as infrastructure naming while its public client surface has been replaced by the External API.
  note: No deprecation notice for the CDP client libraries was ever published; they simply stopped being released.
